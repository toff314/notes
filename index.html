<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>笔记架 · Notes</title>
<style>
  :root { --ink:#1b1b1b; --muted:#6b7280; --line:#e5e7eb; --accent:#0b5fa5; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f6f7f9; color:var(--ink); line-height:1.8;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; padding:64px 32px 100px; }
  h1 { font-size:34px; margin:0 0 .2em; }
  .sub { color:var(--muted); margin:0 0 2.5em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:22px; }
  .card { display:block; background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:26px 28px; text-decoration:none; color:inherit; transition:.18s;
    box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .card:hover { border-color:var(--accent); transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(11,95,165,.12); }
  .card h2 { font-size:19px; margin:.3em 0 .5em; }
  .card p { font-size:14px; color:#4b5563; margin:0 0 1em; }
  .tag { display:inline-block; font-size:12px; color:var(--accent); background:#eaf3fb;
    border-radius:20px; padding:2px 10px; }
  .meta { font-size:13px; color:var(--muted); border-top:1px solid var(--line); padding-top:.8em; }
  footer { margin-top:4em; font-size:13px; color:var(--muted); }
  footer a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>笔记架</h1>
  <p class="sub">听课笔记 · 主笔记 / 思路大纲 / 自测 / 勘误 / 衍生选题</p>

  <div class="grid">
    <a class="card" href="./computational-linguistics/">
      <span class="tag">NLP · 课程</span>
      <h2>计算语言学基础</h2>
      <p>北京邮电大学 · 人工智能学院。第 1 讲绪论的听课笔记：讲者思路主线、康奈尔式摘要、自测题、转写↔课件勘误，以及可投喂下游写作流水线的衍生选题。</p>
      <div class="meta">进度：1 / 3 讲 · 持续更新</div>
    </a>
    <a class="card" href="./mobile-communication-frontier/">
      <span class="tag">课程</span>
      <h2>移动通信技术前沿</h2>
      <p>课堂录音转写 + 课件 → 结构化听课笔记。</p>
      <div class="meta">进度：1 讲 · 持续更新</div>
    </a>
  </div>

  <footer>
    本站由 Caddy 提供静态托管 · 内容以 Markdown 形式开放
  </footer>
</div>
</body>
</html>
