<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>从零构建可观测性</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "Microsoft YaHei", sans-serif; height: 100vh; overflow: hidden; }
.container { display: flex; height: 100vh; }
/* 左侧导航 */
.sidebar { width: 360px; min-width: 360px; border-right: 1px solid #e0e0e0; overflow-y: auto; background: #fafafa; }
.sidebar-header { padding: 16px 20px; background: #1a1a2e; color: #fff; position: sticky; top: 0; z-index: 10; }
.sidebar-header h1 { font-size: 16px; font-weight: 600; }
.sidebar-header .count { font-size: 12px; color: #aaa; margin-top: 4px; }
.chapter-title { padding: 10px 20px 6px; font-size: 13px; color: #888; font-weight: 600; background: #f0f0f0; }
.nav-item { padding: 8px 20px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.15s; }
.nav-item:hover { background: #e8f4fd; }
.nav-item.active { background: #d0e8ff; }
.nav-item a { flex: 1; font-size: 13px; color: #333; text-decoration: none; }
.nav-item a:hover { color: #1890ff; }
/* 右侧内容 */
.content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.toolbar { padding: 8px 16px; background: #f5f5f5; border-bottom: 1px solid #e0e0e0; display: flex; gap: 8px; align-items: center; min-height: 44px; flex-shrink: 0; }
.toolbar button { padding: 4px 12px; border: 1px solid #d9d9d9; border-radius: 4px; background: #fff; cursor: pointer; font-size: 13px; }
.toolbar button:hover { border-color: #1890ff; color: #1890ff; }
.toolbar .title-display { flex: 1; font-size: 13px; color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#contentArea { flex: 1; overflow: hidden; display: flex; }
#contentArea iframe { flex: 1; border: none; width: 100%; height: 100%; background: #fff; }
#contentArea video { max-width: 100%; width: 100%; height: 100%; object-fit: contain; background: #000; }
#contentArea audio { max-width: 100%; }
/* 空状态 */
.empty-state { display: flex; align-items: center; justify-content: center; flex: 1; width: 100%; color: #ccc; font-size: 18px; }
</style>
</head>
<body>
<div class="container">
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>从零构建可观测性</h1>
      <div class="count" id="countDisplay">加载中...</div>
    </div>
    <div id="navList"></div>
  </div>
  <div class="content">
    <div class="toolbar">
      <button onclick="loadContent('html')">📄 正文</button>
      <button onclick="loadContent('video')">🎬 视频</button>
      <button onclick="loadContent('audio')">🎵 音频</button>
      <button onclick="loadContent('attachments')">📎 附件</button>
      <span class="title-display" id="titleDisplay"></span>
    </div>
    <div id="contentArea" class="empty-state">← 点击左侧章节开始学习</div>
  </div>
</div>
<script>
let currentItem = null;
let currentMode = 'html';

// 从 chapters.json 加载章节数据（保持平台原始顺序）
fetch('chapters.json')
  .then(r => r.json())
  .then(chapters => {
    const navList = document.getElementById('navList');
    let html = '';
    let totalCount = 0;

    chapters.forEach(ch => {
      html += '<div class="chapter-title">' + escapeHtml(ch.title) + '</div>';
      (ch.articles || []).forEach(art => {
        totalCount++;
        const rel = ch.title_safe + '/' + art.title_safe + '/' + art.title_safe;
        const videoPath = art.has_video ? rel + '.mp4' : '';
        const audioPath = art.has_audio ? rel + '.mp3' : '';
        const attachPath = art.has_attachment ? rel.replace(/\/+$/, '') : '';
        html += '<div class="nav-item">'
          + '<a href="#" data-html="' + rel + '.html" data-video="' + videoPath + '" data-audio="' + audioPath + '" data-attach="' + attachPath + '">'
          + escapeHtml(art.title) + '</a></div>';
      });
    });

    navList.innerHTML = html;
    document.getElementById('countDisplay').textContent = totalCount + ' 讲';
    bindNavEvents();
  })
  .catch(err => {
    document.getElementById('countDisplay').textContent = '加载失败';
    console.error('加载 chapters.json 失败:', err);
  });

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function bindNavEvents() {
  document.querySelectorAll('.nav-item a').forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      selectItem(a);
      loadContent(currentMode);
    });
  });
}

function selectItem(a) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  a.closest('.nav-item').classList.add('active');
  currentItem = {
    html: a.dataset.html,
    video: a.dataset.video,
    audio: a.dataset.audio,
    attach: a.dataset.attach,
    title: a.textContent
  };
  document.getElementById('titleDisplay').textContent = currentItem.title;
}

function loadContent(mode) {
  if (!currentItem) return;
  currentMode = mode;
  const area = document.getElementById('contentArea');
  area.className = '';

  if (mode === 'html' && currentItem.html) {
    area.innerHTML = '<iframe src="' + currentItem.html + '"></iframe>';
  } else if (mode === 'video' && currentItem.video) {
    area.innerHTML = '<video src="' + currentItem.video + '" controls autoplay></video>';
  } else if (mode === 'audio' && currentItem.audio) {
    area.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:#f9f9f9;">'
      + '<audio src="' + currentItem.audio + '" controls autoplay style="width:90%;"></audio></div>';
  } else if (mode === 'attachments') {
    // 附件在 iframe 正文页面内展示，直接加载正文 HTML（正文页已含附件下载链接）
    if (currentItem.html) {
      area.innerHTML = '<iframe src="' + currentItem.html + '#attachments"></iframe>';
    } else {
      area.className = 'empty-state';
      area.textContent = '暂无附件';
    }
  } else {
    area.className = 'empty-state';
    area.textContent = '暂无' + (mode === 'html' ? '正文' : mode === 'video' ? '视频' : mode === 'audio' ? '音频' : '附件') + '内容';
  }
}
</script>
</body>
</html>
